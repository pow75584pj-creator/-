<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Solid emerald green background -->
  <rect width="1024" height="1024" fill="#27A870"/>

  <!-- Calendar white body -->
